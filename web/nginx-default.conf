# ── Automation User-Agent denylist (known-bad substrings only) ────────
# Real browsers + the Capacitor WebView never match (the mobile app is a
# LOCAL bundle and never fetches from this origin anyway). Legit search
# crawlers (Googlebot/Bingbot) are steered by robots.txt, not 403'd.
# Generic infra clients (Go-http-client) are deliberately NOT listed so a
# platform health check is never blocked. Trivially spoofable by design —
# this is a speed-bump, not a wall.
map $http_user_agent $ua_blocked {
  default            0;
  "~*curl"           1;
  "~*wget"           1;
  "~*python-requests" 1;
  "~*python-urllib"  1;
  "~*scrapy"         1;
  "~*httpie"         1;
  "~*libwww-perl"    1;
  "~*java/"          1;
  "~*okhttp"         1;
  "~*axios"          1;
  "~*node-fetch"     1;
  # Empty User-Agent — a strong bot signal (browsers always send one).
  # ROLLBACK NOTE: if the Railway/host deploy ever reports UNHEALTHY after
  # shipping this, remove THIS line first — an infra readiness probe with
  # no UA is the single most likely false-positive.
  ""                 1;
}

# ── Anti-abuse master switch (SITSD scan window) ──────────────────────
# Rendered from the container env var ANTI_ABUSE_ENABLED at start-up by the
# nginx-unprivileged image's envsubst templating (NGINX_ENVSUBST_FILTER limits
# substitution to PORT|ANTI_ABUSE_ENABLED, so nginx's own $-vars are untouched).
#   "1" = friction ON  (normal operations — default)
#   "0" = friction OFF (a vulnerability scanner's curl/python/empty-UA probes
#         must NOT be 403'd, or the web-app scan coverage is skewed).
# Set the Railway service var ANTI_ABUSE_ENABLED=0 for the scan, restore 1 after.
# The `map $host …` form is the standard idiom for injecting an env value into
# nginx config via envsubst (every request resolves to the rendered constant).
map $host $anti_abuse_enabled { default "${ANTI_ABUSE_ENABLED}"; }

# The platform health-check path is NEVER anti-abuse-blocked: Railway's readiness
# probe can send an empty/non-browser User-Agent, which would otherwise 403 and
# leave the service permanently UNHEALTHY (restart loop). `/healthz` is exempted
# here so the anti-abuse `if` below never fires for it.
map $uri $health_probe { default 0; "/healthz" 1; }

# Enforce ONLY when: not the health path AND the master switch is on AND the
# per-request UA signal fired. Every other combination (incl. any health probe)
# resolves to 0 → not blocked.
map "$health_probe:$anti_abuse_enabled:$ua_blocked" $do_ua_block { "0:1:1" 1; default 0; }

# ── Version-disclosure hardening ──────────────────────────────────────
# Suppress the nginx version in the `Server:` response header and on
# generated error pages (bare `nginx` instead of `nginx/1.27.x`). Removes a
# near-certain Nessus/CIS "web server version disclosure" finding. http scope
# (this file is include'd into the base image's http{} block) so it covers
# every server/location including 4xx/5xx bodies.
server_tokens off;

# ── Compression ──────────────────────────────────────────────
# Without this, nginx serves every asset RAW — the ~1.03 MB-gzip entry chunk
# downloads as ~3.5 MB to every user, including rural-Montana cell users the
# mission centers on. Compress text-like responses; leave already-compressed
# images alone. ~70% fewer wire bytes per JS/CSS/JSON.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types application/javascript text/javascript text/css application/json application/geo+json application/manifest+json image/svg+xml application/wasm;

server {
  # Rendered from $PORT by the base image's envsubst templating at start-up
  # (Railway injects $PORT; ENV PORT=8080 in the Dockerfile is the local default).
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static SPA has no uploads — cap request bodies defensively (defense-in-depth).
  client_max_body_size 1m;

  # Deny hidden dotfiles (.git, .env, editor swap files) as belt-and-suspenders
  # — the served root is only the built dist/ (no dotfiles), but this guarantees
  # nothing dotted is ever served if one lands. 404 (not 403) avoids confirming
  # the path exists. /.well-known/ is exempt so ACME / App-Links keep working.
  location ~ /\.(?!well-known/) {
    access_log off;
    deny all;
    return 404;
  }

  # Block automation UAs everywhere (safe inside `if` — return only).
  # Gated by the anti-abuse master switch so a scanner isn't 403'd when OFF, and
  # by $health_probe so the platform readiness check (below) is never blocked.
  if ($do_ua_block) { return 403; }

  # Platform health/readiness probe. Always 200, bypasses anti-abuse (see the
  # $health_probe map) + caching. Railway's healthcheckPath points here.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Honeypot: a decoy path linked only by a hidden nofollow anchor in
  # index.html + Disallow'd in robots.txt. A real user / assistive tech
  # never reaches it; a link-following scraper that ignores nofollow does.
  # 444 drops the connection with no response — cheap deterrent now, and a
  # clean high-signal trigger for a future FWP WAF/Cloudflare IP ban.
  # Serves a normal 404 when the anti-abuse switch is OFF (scan window).
  location /trap/ {
    if ($anti_abuse_enabled = "0") { return 404; }
    return 444;
  }

  # Hashed assets — long cache.
  location /assets/ {
    include /etc/nginx/snippets/engage-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Other static assets (json, fonts, css, images) — long cache.
  location ~* \.(json|woff2?|css|svg|png|jpg|jpeg|gif|webp|ico)$ {
    include /etc/nginx/snippets/engage-security-headers.conf;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # SPA fallback — every client-routed path (/hunt/legal-hours, /explore, …) serves index.html.
  location / {
    include /etc/nginx/snippets/engage-security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}
