add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://js.arcgis.com 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://js.arcgis.com; connect-src 'self' data: https://regs-api-production.up.railway.app https://services.arcgisonline.com https://server.arcgisonline.com https://basemap.nationalmap.gov https://*.arcgis.com https://gis-mtfwp.hub.arcgis.com https://fwp-gis.mt.gov https://gis.dnrc.mt.gov https://gisservice.mt.gov https://apps.fs.usda.gov https://gis.blm.gov https://gis.missoulacounty.us https://gisweb.bozeman.net https://helenamontanamaps.org https://waterservices.usgs.gov https://mapservices.weather.noaa.gov; img-src 'self' data: blob: https://*.arcgis.com https://services.arcgisonline.com https://server.arcgisonline.com https://basemap.nationalmap.gov https://mapservices.weather.noaa.gov; font-src 'self' https://js.arcgis.com https://static.arcgis.com; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
