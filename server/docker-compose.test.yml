# Throwaway Postgres for the server integration tests (CI + local-with-docker).
# `npm run test:server` brings this up, points TEST_DATABASE_URL at it, runs vitest
# (globalSetup migrates+seeds+fixtures), then tears it down. Locally without Docker,
# set TEST_DATABASE_URL to any reachable empty Postgres and run vitest directly.
services:
  regs-test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: regs_test
    ports:
      - "54329:5432"
    tmpfs:
      - /var/lib/postgresql/data # ephemeral — fast, wiped on down
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
